name: Update catalogue data
env:
  IGDB_API_KEY: ${{ secrets.IGDB_KEY }}
  IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT }}
  TMDB_API_KEY: ${{ secrets.TMDB_KEY }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, 'content(catalogue):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask

      # Release, and cargo direct rather than the debug `pnpm run update-data`, so
      # this shares one warm cache with the other xtask workflow.
      - name: Update catalogue data
        env:
          IGDB_KEY: ${{ secrets.IGDB_KEY }}
          IGDB_CLIENT: ${{ secrets.IGDB_CLIENT }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: cargo run --release -p xtask -- update-catalogue --silent

      # Fetching metadata takes minutes, so main has often moved on by now. Autostash
      # replays the generated files onto its tip, rather than losing them to a
      # rejected push.
      - name: Catch up to main
        run: |
          git fetch origin main
          git rebase --autostash origin/main

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[ci] update catalogue data"
          branch: ${{ github.head_ref }}

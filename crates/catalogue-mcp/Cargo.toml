[package]
name = "erika-catalogue-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing Erika's catalogue (games, movies, shows, books) as queryable tools"
license = "MIT"
repository = "https://github.com/Princesseuh/erika.florist"
readme = "README.md"
keywords = ["mcp", "catalogue", "claude"]

[dependencies]
rmcp = { version = "3.1.4", features = ["transport-io"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = "1.0"
ureq = "3.4.0"
nucleo-matcher = "0.3.1"
unicode-normalization = "0.1.25"

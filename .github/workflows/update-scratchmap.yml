name: Update scratch map

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

# Unlike the deploy workflow, a run in flight is never cancelled: it writes the
# caches it fetched, so a manual dispatch waits rather than truncating one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Pull visited cells from the Worker
        env:
          SCRATCHMAP_TOKEN: ${{ secrets.SCRATCHMAP_TOKEN }}
        run: cargo run --release -p xtask -- update-scratchmap --silent

      # Release, not the `cargo xtask` alias: tiling a region runs inside geo and
      # h3o, and their debug assertions cost more here than the optimiser saves.
      - name: Compute region completion
        run: cargo run --release -p xtask -- update-regions --silent

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[ci] update scratchmap"
          file_pattern: crates/website/content/scratchmap/*.json
